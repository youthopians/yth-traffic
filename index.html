<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>YTH Project Management</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
/* Layout: fixed left rail for navigation on desktop, top bar + scrolling tabs on phones; content is tables and compact panels */
:root{
  --blue:#0056B8; --orange:#F4A200; --pink:#FF6B6B;
  --bg:#F3F6FB; --surface:#FFFFFF; --surface2:#F8FAFD; --line:#DCE3EF; --ink:#13203A; --muted:#5A6781;
  --accent:#0056B8; --accent-ink:#FFFFFF; --soft:#E6EFFB;
  --ok:#1C7F52; --ok-bg:#E3F4EB; --warn:#9A6500; --warn-bg:#FDF1D6; --bad:#C63A3A; --bad-bg:#FCE6E6;
  --pink-ink:#C2414A; --pink-bg:#FFE9E9; --orange-ink:#9A6500; --orange-bg:#FDF1D6;
  --shadow:0 8px 30px rgba(19,32,58,.14);
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-head:"Barlow Condensed","Barlow",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1320; --surface:#151D2D; --surface2:#111827; --line:#27324A; --ink:#E5EBF6; --muted:#97A3BC;
  --accent:#4C93EC; --accent-ink:#0D1320; --soft:#1A2943;
  --ok:#52C98F; --ok-bg:#16301F; --warn:#F4B73A; --warn-bg:#33270C; --bad:#FF7E7E; --bad-bg:#3A1A1C;
  --pink-ink:#FF8C8C; --pink-bg:#3A1C20; --orange-ink:#F4B73A; --orange-bg:#33270C;
  --shadow:0 8px 30px rgba(0,0,0,.5); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0D1320; --surface:#151D2D; --surface2:#111827; --line:#27324A; --ink:#E5EBF6; --muted:#97A3BC;
  --accent:#4C93EC; --accent-ink:#0D1320; --soft:#1A2943;
  --ok:#52C98F; --ok-bg:#16301F; --warn:#F4B73A; --warn-bg:#33270C; --bad:#FF7E7E; --bad-bg:#3A1A1C;
  --pink-ink:#FF8C8C; --pink-bg:#3A1C20; --orange-ink:#F4B73A; --orange-bg:#33270C;
  --shadow:0 8px 30px rgba(0,0,0,.5); color-scheme:dark }
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-head);font-weight:700;margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:30px;line-height:1.1}
h2{font-size:21px}
h3{font-size:17px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.label{font-family:var(--f-head);font-size:12.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}

/* shell */
.shell{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
.rail{background:var(--surface);border-right:1px solid var(--line);padding:20px 12px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px}
.brand .mark{width:34px;height:34px;border-radius:8px;background:var(--blue);display:grid;place-items:center;color:#fff;font-family:var(--f-head);font-weight:700;font-size:15px;letter-spacing:.02em}
.brand .t{font-family:var(--f-head);font-weight:700;font-size:20px;line-height:1}
.brand .s{font-size:11.5px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:7px;color:var(--ink);font-weight:500}
.nav button:hover{background:var(--surface2)}
.nav button[aria-current="page"]{background:var(--soft);color:var(--accent);font-weight:600}
.nav button:focus-visible{outline:2px solid var(--accent)}
.nav .count{font-size:12px;background:var(--orange-bg);color:var(--orange-ink);border-radius:20px;padding:0 7px;font-weight:600}
.nav-group{display:flex;flex-direction:column;gap:2px}
.nav-group .label{padding:0 10px 4px}
.rail-foot{margin-top:auto;padding:10px;border-top:1px solid var(--line);font-size:13px;display:flex;flex-direction:column;gap:4px}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.content{padding-block:22px 60px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px;max-width:1320px;width:100%}
.mobile-nav{display:none}
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .rail{display:none}
  .mobile-nav{display:flex;gap:6px;overflow-x:auto;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--surface)}
  .mobile-nav button{all:unset;cursor:pointer;white-space:nowrap;padding:6px 12px;border-radius:20px;font-weight:500;font-size:14px;border:1px solid var(--line)}
  .mobile-nav button[aria-current="page"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .topbar,.content{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  h1{font-size:25px}
}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 13px;border-radius:7px;cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:4px 9px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>span{font-size:13px;font-weight:600;color:var(--muted)}
.field .hint{font-size:12.5px;color:var(--muted);font-weight:400}
input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:8px 10px;min-height:38px}
textarea{min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:640px){.grid2,.grid3{grid-template-columns:1fr}}
.check{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}
.check input{width:16px;height:16px;accent-color:var(--blue)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters select,.filters input{width:auto;min-width:130px}
.filters input[type=search]{min-width:200px;flex:1}

/* surfaces */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{all:unset;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.tile:hover{border-color:var(--accent)}
.tile:focus-visible{outline:2px solid var(--accent)}
.tile .v{font-family:var(--f-head);font-size:30px;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums}
.tile .k{font-size:13px;color:var(--muted);font-weight:500}
.tile.alert .v{color:var(--bad)}
.tile.attn .v{color:var(--orange-ink)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-family:var(--f-head);font-size:12.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface2)}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface2)}
.list{display:flex;flex-direction:column}
.li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.li:last-child{border-bottom:0}
.li .main-t{font-weight:600}
.linkish{all:unset;cursor:pointer;font-weight:600;color:var(--ink)}
.linkish:hover{color:var(--accent);text-decoration:underline}
.empty{padding:18px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px;font-size:14px}

/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;padding:1px 8px;border-radius:20px;font-size:12.5px;font-weight:600;white-space:nowrap;border:1px solid transparent}
.st-todo{background:var(--surface2);color:var(--muted);border-color:var(--line)}
.st-ongoing{background:var(--soft);color:var(--accent)}
.st-review{background:var(--orange-bg);color:var(--orange-ink)}
.st-revision{background:var(--pink-bg);color:var(--pink-ink)}
.st-blocked{background:var(--bad-bg);color:var(--bad)}
.st-done{background:var(--ok-bg);color:var(--ok)}
.pr-Urgent{color:var(--bad);border-color:var(--bad)}
.pr-High{color:var(--orange-ink);border-color:var(--orange-ink)}
.pr-Normal{color:var(--muted);border-color:var(--line)}
.pr-Low{color:var(--muted);border-color:var(--line);opacity:.8}
.lv-available{background:var(--ok-bg);color:var(--ok)}
.lv-approaching{background:var(--warn-bg);color:var(--warn)}
.lv-overloaded{background:var(--bad-bg);color:var(--bad)}
.lv-unknown{background:var(--surface2);color:var(--muted);border-color:var(--line)}
.rec-internal{background:var(--ok-bg);color:var(--ok)}
.rec-reallocate{background:var(--warn-bg);color:var(--warn)}
.rec-outsource{background:var(--pink-bg);color:var(--pink-ink)}
.rec-review{background:var(--surface2);color:var(--muted);border-color:var(--line)}
.tag{display:inline-block;font-size:12px;padding:1px 7px;border-radius:5px;background:var(--surface2);border:1px solid var(--line);margin:1px 2px 1px 0}
.tag.ok{border-color:var(--ok);color:var(--ok);background:var(--ok-bg)}
.due-over{color:var(--bad);font-weight:600}
.due-soon{color:var(--orange-ink);font-weight:600}
.bar{height:6px;background:var(--surface2);border:1px solid var(--line);border-radius:6px;overflow:hidden;min-width:70px}
.bar>i{display:block;height:100%;background:var(--blue)}
.notice{border-left:3px solid var(--orange);background:var(--orange-bg);color:var(--ink);padding:10px 12px;border-radius:0 8px 8px 0;font-size:14px}
.notice.bad{border-color:var(--bad);background:var(--bad-bg)}
.notice.info{border-color:var(--blue);background:var(--soft)}
.notice ul{margin:6px 0 0;padding-left:18px}

/* planning grid */
.plan td,.plan th{text-align:left}
.plan td.cell{cursor:pointer;min-width:120px}
.plan td.cell:hover{outline:2px solid var(--accent);outline-offset:-2px}
.cellbox{display:flex;flex-direction:column;gap:3px}
.cellbox .h{font-weight:700;font-variant-numeric:tabular-nums}
.plan th.sticky,.plan td.sticky{position:sticky;left:0;background:var(--surface);z-index:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{all:unset;cursor:pointer;padding:6px 12px;font-weight:600;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}

/* modal + toast */
.overlay{position:fixed;inset:0;background:rgba(10,18,32,.45);z-index:50;display:flex;justify-content:center;align-items:flex-start;overflow:auto;padding-block:max(30px,env(safe-area-inset-top,0px)) 30px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.modal{background:var(--surface);border-radius:12px;box-shadow:var(--shadow);width:100%;max-width:720px;padding:20px;display:flex;flex-direction:column;gap:14px;border:1px solid var(--line)}
.modal.wide{max-width:980px}
.modal-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));right:max(18px,env(safe-area-inset-right,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:8px;font-weight:600;box-shadow:var(--shadow);max-width:min(420px,calc(100vw - 36px))}
.toast.err{background:var(--bad);color:#fff}
.bell{position:relative}
.bell .dot{position:absolute;top:-4px;right:-4px;background:var(--pink);color:#fff;border-radius:20px;font-size:11px;padding:0 5px;font-weight:700}
.boot{display:grid;place-items:center;min-height:70vh;padding:24px;text-align:center}
.boot .panel{max-width:520px}
.detail-grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px}
@media (max-width:760px){.detail-grid{grid-template-columns:1fr}}
.kv{display:grid;grid-template-columns:120px minmax(0,1fr);gap:6px 10px;font-size:14px}
.kv dt{color:var(--muted);font-weight:500}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.thread{display:flex;flex-direction:column;gap:10px}
.msg{border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:var(--surface2);font-size:14px}
.msg .meta{font-size:12.5px;color:var(--muted);margin-bottom:3px}
.msg.fb{border-color:var(--pink);background:var(--pink-bg)}
.msg.ok{border-color:var(--ok);background:var(--ok-bg)}
.pre{white-space:pre-wrap;overflow-wrap:anywhere}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{all:unset;cursor:pointer;padding:8px 12px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--accent);border-color:var(--accent)}
.tabs button:focus-visible{outline:2px solid var(--accent)}
@media (prefers-reduced-motion:no-preference){.modal{animation:pop .14s ease-out}@keyframes pop{from{transform:translateY(6px);opacity:.6}}}
.picks{display:flex;flex-wrap:wrap;gap:6px}
.pick{all:unset;cursor:pointer;padding:5px 11px;border-radius:20px;border:1px solid var(--line);background:var(--surface);font-size:13.5px;font-weight:500;line-height:1.3}
.pick:hover{border-color:var(--accent)}
.pick:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pick.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.pick.av-free-pick:not(.on){border-color:var(--ok);color:var(--ok)}
.pick.av-busy-pick:not(.on){border-color:var(--warn);color:var(--warn)}
.pick.av-double-pick:not(.on),.pick.av-off-pick:not(.on){border-color:var(--bad);color:var(--bad)}
.pick.on.av-busy-pick,.pick.on.av-double-pick,.pick.on.av-off-pick{box-shadow:0 0 0 2px var(--bad) inset}
.av-free{background:var(--ok-bg);color:var(--ok)}
.av-busy{background:var(--warn-bg);color:var(--warn)}
.av-double{background:var(--bad-bg);color:var(--bad)}
.av-off{background:var(--surface2);color:var(--muted);border-color:var(--line)}
.av-part{background:var(--soft);color:var(--accent)}
.daystrip{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.daystrip .day{border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;min-width:0;overflow-wrap:anywhere}
.plan th.wkend,.plan td.wkend{background:var(--surface2)}
.plan td.past{opacity:.45}
body{margin:0}
.auth{max-width:420px;width:100%}
.auth .tabs{margin-bottom:4px}
</style>
</head>
<body>

<div id="app"><div class="boot"><div><div class="label">YTH Project Management</div><p class="muted">Connecting to your workspace…</p></div></div></div>

<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/preact/standalone.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<script>
const {html, render, useState, useEffect, useRef} = htmPreact;

/* ================= constants ================= */
const STATUSES=['To Do','Ongoing','Ready for Review','Needs Revision','Blocked','Done'];
const ACTIVE=new Set(['To Do','Ongoing','Needs Revision','Blocked']);
const ST_CLASS={'To Do':'st-todo','Ongoing':'st-ongoing','Ready for Review':'st-review','Needs Revision':'st-revision','Blocked':'st-blocked','Done':'st-done'};
const PRIORITIES=['Low','Normal','High','Urgent'];
const PRIO_RANK={Urgent:0,High:1,Normal:2,Low:3};
const PTYPES=['Retainer','One-off','Internal','Proposal/BD'];
const PSTATUS=['Draft','Active','On hold','Completed','Archived'];
const FREQ={weekly:'Weekly',biweekly:'Every 2 weeks',monthly:'Monthly'};
const SKILLS=[
  ['cinematography','Videographer / cinematographer','Freelance videographer / cinematographer'],
  ['photography','Photographer','Freelance photographer'],
  ['video_editing','Video editor','Freelance video editor'],
  ['photo_editing','Photo editor','Freelance photo retoucher'],
  ['graphic_design','Graphic designer / art director','Freelance graphic designer'],
  ['digital_marketing','Digital marketer / content','Freelance content / social media specialist'],
  ['creative_direction','Creative director','Freelance creative director'],
  ['strategy','Strategist / research','Strategy / research consultant'],
  ['production_coordination','Production coordinator','Production assistant / coordinator'],
  ['casting','Casting','Casting agent'],
  ['client_management','Client manager','Contract account manager'],
  ['business_development','Business development','Business development consultant'],
  ['project_oversight','Project oversight','Freelance project manager'],
  ['finance_admin','Finance / admin','Finance / admin support'],
  ['ai_editing','AI-assisted editor','AI editing specialist'],
  ['lighting','Gaffer / lighting','Gaffer / lighting specialist'],
  ['set_design','Set designer','Set designer'],
  ['costume','Costume / wardrobe','Costume specialist'],
  ['makeup','Makeup artist','Makeup artist'],
].map(([id,label,ext])=>({id,label,ext}));
const EXTERNAL_TYPES=['Freelance videographer / cinematographer','Freelance photographer','Production assistant','Gaffer / lighting specialist','Set designer','Costume specialist','Makeup artist','Freelance video editor','Freelance graphic designer','Freelance photo retoucher','Casting agent','Other specialist'];
const DAY_H=8;
const AV={free:{label:'Free',cls:'av-free'},partial:{label:'Partly booked',cls:'av-part'},full:{label:'Fully booked',cls:'av-busy'},over:{label:'Overbooked',cls:'av-double'},off:{label:'Time off',cls:'av-off'},busy:{label:'Not enough time',cls:'av-busy'}};
const TIME_OPTS=[[8,'Full day (8h)'],[4,'Half day (4h)'],[2,'2 hours'],[1,'1 hour']];
const hText=h=>+h>=DAY_H?'full day':`${+h}h`;
const CHK={ok:['Covered','rec-internal'],pick:['Choose someone','rec-review'],swap:['Swap suggested','rec-reallocate'],outsource:['Consider outsourcing','rec-outsource'],outsourced:['Outsourcing','rec-outsource'],nodate:['Add a date','rec-review']};

/* talent detection from task names */
const KW=[
  [/(photo ?shoot|photograph|headshot|portrait|product photo|event photo)/i,'photography'],
  [/(retouch|photo ?edit|edit(ing)? (the )?photos?|photo selection|photo grading)/i,'photo_editing'],
  [/((video|film|documentary|reel|footage|clip|interview)s?.{0,20}(edit|cut|post|colou?r|subtitl|grade))|((edit|cut|post-?production|colou?r grad|subtitl).{0,25}(video|film|documentary|reel|footage|clip|interview))|post-?production|rough cut|final cut/i,'video_editing'],
  [/(shoot|filming|film(ing)? day|videograph|cinematograph|footage capture|b-?roll|drone|livestream|live stream|video coverage|record(ing)? (the )?(interview|video|event))/i,'cinematography'],
  [/(design|poster|flyer|banner|logo|layout|brochure|infographic|graphics?\b|carousel|artwork|mock-?up|key visual|illustrat|rollup|roll-up|billboard|packaging)/i,'graphic_design'],

function bookedDays(t){ const s0=t.start||t.due, e0=t.due||t.start; if(!s0) return []; const s=s0, e=e0<s0?s0:e0; const out=[]; let d=s,g=0; while(d<=e&&g++<400){ if(isWorkday(d)||d===s||d===e) out.push(d); d=addDays(d,1) } return out }
function cycles(r,from,to){ const out=[]; if(!r.firstDue||from>to) return out; let guard=0;
  if(r.frequency==='monthly'){ const a=parseD(r.firstDue); for(let k=0;k<400&&guard++<400;k++){ const dim=new Date(a.getFullYear(),a.getMonth()+k+1,0).getDate(); const s=ymd(new Date(a.getFullYear(),a.getMonth()+k,Math.min(a.getDate(),dim))); if(s>to) break; if(s>=from&&(!r.endDate||s<=r.endDate)) out.push(s) } return out }

  if(d<from){ const n=Math.floor((parseD(from)-parseD(d))/864e5/step); d=addDays(d,n*step) }
  while(d<=to&&guard++<400){ if(d>=from&&(!r.endDate||d<=r.endDate)) out.push(d); d=addDays(d,step) } return out }

const retH=r=>{const h=+r.hoursPerDay; return h>0?Math.min(DAY_H,h):DAY_H};

  const cell=(pid,d)=>{const p=P[pid]; if(!p) return null; return p[d]||(p[d]={tasks:[],ret:[],off:null})};
  let tasks=tasksArr(); if(opts.exclude) tasks=tasks.filter(t=>t.id!==opts.exclude); if(opts.extra) tasks=tasks.concat(opts.extra);
  for(const t of tasks){ if(!ACTIVE.has(t.status)) continue; const days=bookedDays(t).filter(d=>d>=from&&d<=to); if(!days.length) continue; for(const pid of peopleOf(t)) for(const d of days){ const c=cell(pid,d); if(c) c.tasks.push(t) } }
  for(const [rid,r] of Object.entries(S.retainers)){ if(r.status!=='Active') continue;
    for(const due of cycles(r,from,addDays(to,45))){ if(tasks.some(t=>t.retainerId===rid&&t.cycle===due)) continue;
      for(const d of retainerDays(r,due)){ if(d<from||d>to||d<today()) continue; (r.responsibleIds||[]).forEach(pid=>{ const c=cell(pid,d); if(c) c.ret.push({rid,r,due,h:retH(r)}) }) } } }

const EMPTY={tasks:[],ret:[],off:null};
const getCell=(B,pid,d)=>(B[pid]&&B[pid][d])||EMPTY;

const cellItems=c=>[...c.tasks.map(t=>`${t.name} (${hText(taskH(t))})`),...c.ret.map(x=>`${x.r.name} retainer (${hText(x.h)})`)];

  days.forEach(d=>{ const c=getCell(B,pid,d); if(c.off){off.push(d);return} const h=cellHours(c); room+=Math.max(0,DAY_H-h); if(h+need>DAY_H) busy.push({d,c,h}) });

function talentCheck(tal,days,assigned,B,ext,need=DAY_H){
  const skilled=teamArr().filter(m=>hasSkill(m,tal)).map(m=>({m,lvl:skillLvl(m,tal),av:days.length?availability(B,m.id,days,need):null}))
    .sort((a,b)=>((a.av?.st==='free'?0:1)-(b.av?.st==='free'?0:1))||((a.lvl==='primary'?0:1)-(b.lvl==='primary'?0:1))||((b.av?.free||0)-(a.av?.free||0)));
  const label=skillLabel(tal).toLowerCase();
  if(ext) return {st:'outsourced',msg:`Outsourcing: ${ext.type}${ext.note?' — '+ext.note:''}.`,skilled};
  if(!skilled.length) return {st:'outsource',msg:`No one on the team is listed as ${label}. Consider a ${skillExt(tal).toLowerCase()}.`,skilled};
  if(!days.length) return {st:'nodate',msg:'Add a date to see who is free.',skilled};
  const mine=skilled.filter(x=>assigned.includes(x.m.id)); const freeOthers=skilled.filter(x=>!assigned.includes(x.m.id)&&x.av.st==='free');
  const okMine=mine.filter(x=>x.av.st==='free');
  if(okMine.length) return {st:'ok',msg:`${okMine.map(x=>x.m.name).join(' and ')} ${okMine.length>1?'have':'has'} time for this on ${dayRangeText(days)}.`,skilled};
  if(mine.length){ const b=mine[0]; const why=conflictText(b.m.name,b.av);
    if(freeOthers.length) return {st:'swap',msg:`${why}. ${freeOthers[0].m.name} has time — consider assigning them instead.`,skilled,suggest:freeOthers[0].m.id,replace:b.m.id};
    return {st:'outsource',msg:`${why}, and no other ${label} is free. Consider a ${skillExt(tal).toLowerCase()} or moving the date.`,skilled} }
  if(freeOthers.length) return {st:'pick',msg:`Has time on these days: ${freeOthers.map(x=>x.m.name+(x.lvl==='backup'?' (backup)':'')).join(', ')}.`,skilled,suggest:freeOthers[0].m.id};
  return {st:'outsource',msg:`Every ${label} on the team is busy on these days. Consider a ${skillExt(tal).toLowerCase()} or moving the date.`,skilled};
}

  for(const f of list){ try{ const r=await assetsNs.upload(f); out.push({name:f.name,url:r.url,id:r.id}) }catch(e){ toast(`Couldn't upload ${f.name}. Files must be under 20 MB.`,'err') } } return out }

/* ================= small components ================= */
const Status=({s})=>html`<span class=${'chip '+(ST_CLASS[s]||'st-todo')}>${s}</span>`;
const Prio=({p})=>p&&p!=='Normal'?html`<span class=${'chip pr-'+p}>${p}</span>`:null;
const AvChip=({s,text})=>html`<span class=${'chip '+AV[s].cls}>${text||AV[s].label}</span>`;
const ChkChip=({s})=>html`<span class=${'chip '+CHK[s][1]}>${CHK[s][0]}</span>`;
function Due({t}){ if(!t.due) return html`<span class="muted">No date</span>`; const cls=isOverdue(t)?'due-over':dueSoon(t)?'due-soon':''; return html`<span class=${cls+' num'}>${t.start&&t.start!==t.due?fmtD(t.start)+' – ':''}${fmtD(t.due)}${isOverdue(t)?' · overdue':''}</span>` }
function Links({links,files}){ const L=(links||[]).map(safeUrl).filter(Boolean); const F=files||[]; if(!L.length&&!F.length) return null;
  return html`<div class="row small">${L.map(u=>html`<a href=${u} target="_blank" rel="noopener">${u.replace(/^https?:\/\//,'').slice(0,48)}</a>`)}${F.map(f=>html`<a href=${f.url} target="_blank" rel="noopener">📎 ${f.name}</a>`)}</div>` }
function Modal({title,children,wide}){
  useEffect(()=>{const k=e=>{if(e.key==='Escape') closeModal()}; addEventListener('keydown',k); return()=>removeEventListener('keydown',k)},[]);
  return html`<div class="overlay" onMouseDown=${e=>{if(e.target===e.currentTarget) closeModal()}}><div class=${'modal'+(wide?' wide':'')} role="dialog" aria-modal="true" aria-label=${title}>
    <div class="modal-head"><h2>${title}</h2><button class="btn ghost sm" onClick=${closeModal}>Close</button></div>${children}</div></div>` }
function Field({label,hint,children}){ return html`<label class="field"><span>${label}${hint?html` <span class="hint">${hint}</span>`:''}</span>${children}</label>` }
function FieldBox({label,hint,children}){ return html`<div class="field"><span>${label}${hint?html` <span class="hint">${hint}</span>`:''}</span>${children}</div>` }
function EmptyState({text,action}){ return html`<div class="empty"><div>${text}</div>${action?html`<div style="margin-top:10px">${action}</div>`:''}</div>` }
function PersonSelect({value,onChange,noneLabel}){ return html`<select value=${value||''} onChange=${e=>onChange(e.target.value||null)}><option value="">${noneLabel||'None'}</option>${teamArr().map(m=>html`<option value=${m.id}>${m.name}</option>`)}</select>` }
function MultiPick({options,value,onChange,render:renderOpt}){ const v=value||[];
  return html`<div class="picks">${options.map(o=>{const on=v.includes(o.id); return html`<button type="button" class=${'pick'+(on?' on':'')+(o.cls?' '+o.cls:'')} aria-pressed=${on} title=${o.title||''} onClick=${()=>onChange(on?v.filter(x=>x!==o.id):[...v,o.id])}>${renderOpt?renderOpt(o,on):o.label}</button>`})}</div>` }
function ConfirmPanel({warnings,reasonRequired,onBack,onConfirm,confirmLabel}){ const [reason,setReason]=useState('');
  return html`<div class="notice bad stack"><div><b>Check before saving</b><ul>${warnings.map(w=>html`<li>${w}</li>`)}</ul></div>
    <${Field} label=${reasonRequired?'Reason (required, this affects retainer work)':'Reason (optional, saved in the task history)'}><input id="override-reason" type="text" value=${reason} onInput=${e=>setReason(e.target.value)} placeholder="e.g. Shoot can't move; Yonas agreed to cover both"/><//>
    <div class="row"><button class="btn" onClick=${onBack}>Go back</button><button class="btn primary" disabled=${reasonRequired&&!reason.trim()} onClick=${()=>onConfirm(reason.trim())}>${confirmLabel||'Save anyway'}</button></div></div>` }

/* ================= task form (admin): assignment with live availability ================= */
function TaskForm({task,defaults}){
  const editing=!!task;
  const base=task?{...clone(task),assigneeIds:peopleOf(task)}:{name:'',projectId:defaults?.projectId||'',description:'',assigneeIds:defaults?.assigneeIds||[],talents:[],external:[],start:defaults?.start||'',due:defaults?.due||'',hoursPerDay:null,priority:'Normal',needsReview:true,reviewerId:null,memberCanComplete:true,links:[],files:[],retainerId:null};
  const [f,setF]=useState({...base,hoursPerDay:task?(task.hoursPerDay||DAY_H):base.hoursPerDay,talents:base.talents||[],external:base.external||[],linksText:(base.links||[]).join('\n')});
  const [touchedTal,setTouchedTal]=useState(editing); const [warn,setWarn]=useState(null); const [busy,setBusy]=useState(false);
  const set=(k,v)=>setF(o=>({...o,[k]:v}));
  function onName(v){ setF(o=>{ const n={...o,name:v}; if(!touchedTal){ const det=detectTalents(v); n.talents=det } return n }) }
  const days=bookedDays(f); const futureDays=days.filter(d=>d>=today());
  const from=days[0]||today(), to=days[days.length-1]||today();
  const B=buildBookings(minS(from,today()),maxS(to,today()),{exclude:task?.id});
  const need=+f.hoursPerDay||DAY_H;
  const checks=f.talents.map(tal=>({tal,...talentCheck(tal,futureDays,f.assigneeIds,B,f.external.find(x=>x.talent===tal),need)}));
  const toggleP=pid=>set('assigneeIds',f.assigneeIds.includes(pid)?f.assigneeIds.filter(x=>x!==pid):[...f.assigneeIds,pid]);
  const swap=(add,rem)=>set('assigneeIds',[...f.assigneeIds.filter(x=>x!==rem),add].filter((x,i,a)=>a.indexOf(x)===i));
  const setExt=(tal,on)=>set('external',on?[...f.external.filter(x=>x.talent!==tal),{talent:tal,type:skillExt(tal),name:'',note:''}]:f.external.filter(x=>x.talent!==tal));
  const editExt=(tal,patch)=>set('external',f.external.map(x=>x.talent===tal?{...x,...patch}:x));
  function build(){ return {name:f.name.trim(),projectId:f.projectId||null,description:f.description||'',assigneeIds:f.assigneeIds,talents:f.talents,external:f.external,hoursPerDay:+f.hoursPerDay||null,start:f.start&&f.due&&f.start>f.due?f.due:(f.start||''),due:f.due||'',priority:f.priority,needsReview:!!f.needsReview,reviewerId:f.needsReview?(f.reviewerId||null):null,memberCanComplete:!!f.memberCanComplete,links:splitLines(f.linksText),files:f.files||[],retainerId:f.retainerId||null} }
  function attempt(){ const b=build(); if(!b.name){toast('Give the task a name.','err');return} if(!b.due){toast('Add a date (the deadline or shoot day).','err');return} if(!b.hoursPerDay){toast('Choose how much time this takes each day: a few hours or a full day.','err');return}
    const changed=!editing||task.due!==b.due||task.start!==b.start||taskH(task)!==b.hoursPerDay||peopleOf(task).join()!==b.assigneeIds.join();
    const warnings=[]; let ret=false;
    if(changed){ const ds=bookedDays(b).filter(d=>d>=today());
      b.assigneeIds.forEach(pid=>{ const av=availability(B,pid,ds,b.hoursPerDay); if(av.st!=='free'){ warnings.push(conflictText(tName(pid),av)+'.'); if(av.ret) ret=true } });
      b.talents.forEach(tal=>{ if(!b.external.some(x=>x.talent===tal)&&!b.assigneeIds.some(pid=>S.team[pid]&&hasSkill(S.team[pid],tal))) warnings.push(`No one assigned is listed as ${skillLabel(tal).toLowerCase()}, and it isn't marked for outsourcing.`) });
      if(editing&&isRetainerTask(task)&&(task.due!==b.due||peopleOf(task).join()!==b.assigneeIds.join())){ ret=true; warnings.push('This is retainer work. Changing its people or date affects a recurring client commitment.') } }
    if(warnings.length){ setWarn({warnings,ret,b}); return } commit(b,'') }
  async function commit(b,reason){ setBusy(true); const id=task?.id||uid();
    try{
      if(!editing){ const t={...b,status:'To Do',createdAt:nowISO(),createdBy:ui.myId,comments:[],submissions:[],history:[hist('Created'+(b.assigneeIds.length?` and assigned to ${b.assigneeIds.map(tName).join(', ')}`:''))]};
        if(b.external.length) t.history.push(hist('Outsourcing: '+b.external.map(x=>x.type).join(', ')));
        if(reason) t.history.push(hist('Conflict accepted: '+reason));
        await saveTaskDoc(id,t); b.assigneeIds.forEach(p=>notify(p,`New task: ${b.name} · ${dayRangeText(bookedDays(b))}`,id)); toast('Task created') }
      else { const t={...clone(task),...b}; delete t.id; delete t.assigneeId; delete t.contributors; delete t.estHours; t.history=t.history||[];
        const before=peopleOf(task), after=b.assigneeIds; const added=after.filter(x=>!before.includes(x)), removed=before.filter(x=>!after.includes(x));
        if(added.length||removed.length){ t.history.push(hist(`People changed: ${added.length?'added '+added.map(tName).join(', '):''}${added.length&&removed.length?'; ':''}${removed.length?'removed '+removed.map(tName).join(', '):''}`)); added.forEach(p=>notify(p,`Added to task: ${b.name}`,id)); removed.forEach(p=>notify(p,`Removed from task: ${b.name}`,id)) }
        if(task.due!==b.due||task.start!==b.start){ t.history.push(hist(`Dates changed to ${dayRangeText(bookedDays(b))}`)); after.filter(x=>!added.includes(x)).forEach(p=>notify(p,`New dates for ${b.name}: ${dayRangeText(bookedDays(b))}`,id)) }
        if(reason) t.history.push(hist('Conflict accepted: '+reason));
        await saveTaskDoc(id,t); toast('Task saved') }
      if(reason&&warn?.ret) notify('_admins',`Retainer work overridden for ${b.name}: ${reason}`,id);
      closeModal();
    }catch(e){} setBusy(false) }
  async function addFiles(e){ const up=await uploadFiles(e.target.files); if(up.length) set('files',[...(f.files||[]),...up]); e.target.value='' }
  const projOpts=projArr().filter(p=>p.status!=='Archived').sort((a,b)=>a.name.localeCompare(b.name));
  const personOpts=teamArr().map(m=>{ const av=futureDays.length?availability(B,m.id,futureDays,need):null; const relevant=f.talents.some(t=>hasSkill(m,t));
    return {id:m.id,label:m.name,cls:av?AV[av.st].cls+'-pick':'',title:av?(av.st==='free'?'Has time on these days':conflictText(m.name,av)):'',av,relevant} });
  personOpts.sort((a,b)=>(b.relevant-a.relevant));
  return html`<${Modal} title=${editing?'Edit task':'New task'} wide>
    ${warn?html`<${ConfirmPanel} warnings=${warn.warnings} reasonRequired=${warn.ret} onBack=${()=>setWarn(null)} onConfirm=${r=>commit(warn.b,r)} confirmLabel=${editing?'Save anyway':'Create anyway'}/>`:html`
    <div class="stack">
      <${Field} label="Task name"><input id="t-name" type="text" value=${f.name} onInput=${e=>onName(e.target.value)} placeholder="e.g. Kuriftu video shoot, Magna menu poster design"/><//>
      <div class="grid3">
        <${Field} label="Project"><select id="t-proj" value=${f.projectId||''} onChange=${e=>set('projectId',e.target.value)}><option value="">No project</option>${projOpts.map(p=>html`<option value=${p.id}>${p.name}${p.client?' · '+p.client:''}</option>`)}</select><//>
        <${Field} label="Start date" hint="for multi-day work"><input id="t-start" type="date" value=${f.start} onInput=${e=>set('start',e.target.value)}/><//>
        <${Field} label="Date / deadline" hint="shoot day or due date"><input id="t-due" type="date" value=${f.due} onInput=${e=>set('due',e.target.value)}/><//>
      </div>
      <${FieldBox} label="How much time does this take each day?" hint="a day is only fully booked at 8 hours">
        <div class="picks">${TIME_OPTS.map(([h,l])=>html`<button type="button" class=${'pick'+(+f.hoursPerDay===h?' on':'')} aria-pressed=${+f.hoursPerDay===h} onClick=${()=>set('hoursPerDay',h)}>${l}</button>`)}
          <span class="row" style="gap:4px;flex-wrap:nowrap"><input type="number" min="0.5" max="8" step="0.5" style="width:84px" aria-label="Custom hours per day" placeholder="Other" value=${f.hoursPerDay&&!TIME_OPTS.some(([h])=>h===+f.hoursPerDay)?f.hoursPerDay:''} onInput=${e=>set('hoursPerDay',e.target.value===''?null:Math.min(8,Math.max(0.5,+e.target.value)))}/><span class="small muted">hours</span></span></div>
        ${!f.hoursPerDay?html`<span class="small due-soon">Choose one so availability can be checked.</span>`:''}<//>
      <${FieldBox} label="Talent needed" hint=${!touchedTal&&f.talents.length?'suggested from the task name, tap to change':'tap to select'}>
        <${MultiPick} options=${SKILLS.map(s=>({id:s.id,label:s.label}))} value=${f.talents} onChange=${v=>{setTouchedTal(true);set('talents',v)}}/><//>

      ${f.talents.length?html`<div class="panel" style="background:var(--surface2)">
        <div class="panel-head"><h3>Who's available</h3><span class="small muted">${futureDays.length?dayRangeText(futureDays)+' · '+plural(futureDays.length,'day')+' · '+hText(need)+(f.hoursPerDay?'':' (assumed)')+' each':'Add a date to check'}</span></div>
        ${checks.map(c=>html`<div class="stack" style="gap:6px;border-bottom:1px solid var(--line);padding-bottom:10px">
          <div class="row between"><b>${skillLabel(c.tal)}</b><${ChkChip} s=${c.st}/></div>
          <div class="small">${c.msg}${c.suggest&&c.st==='swap'?html` <button class="btn sm" onClick=${()=>swap(c.suggest,c.replace)}>Swap to ${tName(c.suggest)}</button>`:''}${c.suggest&&c.st==='pick'?html` <button class="btn sm" onClick=${()=>toggleP(c.suggest)}>Assign ${tName(c.suggest)}</button>`:''}</div>
          ${c.skilled.length?html`<div class="picks">${c.skilled.map(x=>{const on=f.assigneeIds.includes(x.m.id); const st=x.av?x.av.st:null; return html`<button type="button" class=${'pick'+(on?' on':'')+(st?' '+AV[st].cls+'-pick':'')} aria-pressed=${on} title=${st&&st!=='free'?conflictText(x.m.name,x.av):''} onClick=${()=>toggleP(x.m.id)}>${x.m.name}${x.lvl==='backup'?' (backup)':''}${st?html` · <span class="small">${st==='free'?'has time':st==='off'?'time off':'no room '+x.av.busy.length+'d'}</span>`:''}</button>`})}</div>`:''}
          <label class="check small"><input type="checkbox" checked=${f.external.some(x=>x.talent===c.tal)} onChange=${e=>setExt(c.tal,e.target.checked)}/> Outsource this talent</label>
          ${f.external.some(x=>x.talent===c.tal)?html`<div class="grid3"><${Field} label="Freelancer's name" hint="optional"><input type="text" list="ext-names" placeholder="e.g. Dawit (freelance)" value=${f.external.find(x=>x.talent===c.tal).name||''} onInput=${e=>editExt(c.tal,{name:e.target.value})}/><//>
            <${Field} label="Type"><select value=${f.external.find(x=>x.talent===c.tal).type} onChange=${e=>editExt(c.tal,{type:e.target.value})}>${[...new Set([skillExt(c.tal),...EXTERNAL_TYPES])].map(x=>html`<option>${x}</option>`)}</select><//>
            <${Field} label="Note"><input type="text" placeholder="Phone, budget, status" value=${f.external.find(x=>x.talent===c.tal).note} onInput=${e=>editExt(c.tal,{note:e.target.value})}/><//></div>
            <span class="small muted">Outsourced people aren't team members, so they don't count in team availability.</span>`:''}
        </div>`)}
        <datalist id="ext-names">${teamArr(true).filter(m=>m.kind==='external').map(m=>html`<option value=${m.name}/>`)}</datalist>
        <div class="small muted">The app records outsourcing. It doesn't contact or book anyone.</div>
      </div>`:''}

      <${FieldBox} label="Assigned people" hint=${futureDays.length?'green = has time, amber = not enough time, red = time off':'select one or more'}>
        <${MultiPick} options=${personOpts} value=${f.assigneeIds} onChange=${v=>set('assigneeIds',v)} render=${(o)=>html`${o.label}${o.av&&o.av.st!=='free'?html` <span class="small">· ${o.av.st==='off'?'time off':'no room'}</span>`:''}`}/><//>
      <${Field} label="Instructions"><textarea id="t-desc" value=${f.description} onInput=${e=>set('description',e.target.value)} placeholder="What needs to be done, references, format, specs"></textarea><//>
      <div class="grid3">
        <${Field} label="Priority"><select id="t-prio" value=${f.priority} onChange=${e=>set('priority',e.target.value)}>${PRIORITIES.map(p=>html`<option>${p}</option>`)}</select><//>
        <${FieldBox} label="Review"><label class="check" style="min-height:38px"><input type="checkbox" checked=${f.needsReview} onChange=${e=>set('needsReview',e.target.checked)}/> Needs review before Done</label><//>
        ${f.needsReview?html`<${Field} label="Reviewer"><${PersonSelect} value=${f.reviewerId} onChange=${v=>set('reviewerId',v)} noneLabel="Admin"/><//>`:html`<${FieldBox} label="Completion"><label class="check" style="min-height:38px"><input type="checkbox" checked=${f.memberCanComplete} onChange=${e=>set('memberCanComplete',e.target.checked)}/> Assignees can mark it Done</label><//>`}
      </div>
      <div class="grid2">
        <${Field} label="Links" hint="one per line"><textarea id="t-links" style="min-height:60px" value=${f.linksText} onInput=${e=>set('linksText',e.target.value)} placeholder="Drive folder, brief, reference"></textarea><//>
        <${FieldBox} label="Attachments">${assetsNs?html`<input type="file" multiple onChange=${addFiles}/>`:html`<span class="small muted">Add links instead.</span>`}<${Links} files=${f.files}/><//>
      </div>
      <div class="row between"><span class="small muted">Saving updates the project, each person's My Work and the workload view straight away.</span>
        <button class="btn primary" disabled=${busy} onClick=${attempt}>${editing?'Save task':'Create task'}</button></div>
    </div>`}
  <//>`;
}

/* ================= task detail ================= */
function TaskDetail({id}){
  const t0=S.tasks[id]; const [comment,setComment]=useState(''); const [sub,setSub]=useState({note:'',links:'',files:[]});
  const [fb,setFb]=useState(''); const [blockR,setBlockR]=useState(''); const [mode,setMode]=useState(null); const [busy,setBusy]=useState(false);
  if(!t0) return html`<${Modal} title="Task"><p class="muted">This task was deleted or you don't have access to it.</p><//>`;
  const t={...t0,id}; const mine=isMine(t); const admin=ui.isAdmin; const reviewer=canReview(t); const canWork=mine||admin;
  const lastSub=(t.submissions||[]).slice(-1)[0]; const people=peopleOf(t);
  async function act(fn,msg){ setBusy(true); try{ await mutateTask(id,fn); if(msg) toast(msg); setMode(null) }catch(e){} setBusy(false) }
  const setStatus=s=>act(x=>{x.history=x.history||[]; x.history.push(hist(`Status: ${x.status} → ${s}`)); x.status=s; if(s==='Done') x.completedAt=nowISO()},'Status updated');
  async function block(){ const r=blockR.trim(); if(!r) return; await act(x=>{x.history.push(hist('Blocked: '+r)); x.status='Blocked'; x.blockedReason=r},'Marked as blocked'); notify('_admins',`Blocked: ${t.name} — ${r}`,id); if(t.reviewerId) notify(t.reviewerId,`Blocked: ${t.name}`,id); setBlockR('') }
  async function submit(){ const links=splitLines(sub.links); if(!sub.note.trim()&&!links.length&&!sub.files.length){toast('Add a note, link or file.','err');return}
    const toReview=t.needsReview!==false;
    await act(x=>{ x.submissions=x.submissions||[]; x.submissions.push({id:uid(),at:nowISO(),by:ui.myId,note:sub.note.trim(),links,files:sub.files,decision:null}); x.history.push(hist(toReview?`Submitted for review (version ${x.submissions.length})`:'Completed')); x.status=toReview?'Ready for Review':'Done'; if(!toReview) x.completedAt=nowISO() },toReview?'Submitted for review':'Marked as done');
    if(toReview) notify(t.reviewerId||'_admins',`Ready for review: ${t.name} (from ${tName(ui.myId)})`,id); setSub({note:'',links:'',files:[]}) }
  async function approve(){ await act(x=>{ const s=x.submissions?.slice(-1)[0]; if(s){s.decision='approved'; s.reviewedAt=nowISO(); s.reviewedBy=ui.myId; if(fb.trim()) s.feedback=fb.trim()} x.status='Done'; x.completedAt=nowISO(); x.history.push(hist('Approved'+(fb.trim()?': '+fb.trim():''))) },'Approved — task is Done'); people.forEach(p=>notify(p,`Approved: ${t.name}`,id)); setFb('') }
  async function revise(){ if(!fb.trim()){toast('Write the feedback the team needs.','err');return} await act(x=>{ const s=x.submissions?.slice(-1)[0]; if(s){s.decision='revision'; s.reviewedAt=nowISO(); s.reviewedBy=ui.myId; s.feedback=fb.trim()} x.status='Needs Revision'; x.history.push(hist('Revisions requested')) },'Sent back for revision'); people.forEach(p=>notify(p,`Revisions requested: ${t.name}`,id)); setFb('') }
  async function addComment(){ if(!comment.trim()) return; await act(x=>{ x.comments=x.comments||[]; x.comments.push({id:uid(),at:nowISO(),by:ui.myId,text:comment.trim()}); if(x.comments.length>200) x.comments=x.comments.slice(-200) });
    [...people,t.reviewerId].filter(x=>x&&x!==ui.myId).forEach(p=>notify(p,`New comment on ${t.name}`,id)); if(!admin) notify('_admins',`${tName(ui.myId)} commented on ${t.name}`,id); setComment('') }
  async function subFiles(e){ const up=await uploadFiles(e.target.files); if(up.length) setSub(o=>({...o,files:[...o.files,...up]})); e.target.value='' }
  async function del(){ setBusy(true); try{ await dbDel('tasks/'+id); toast('Task deleted'); closeModal() }catch(e){} setBusy(false) }
  const proj=S.projects[t.projectId];
  const canSubmit=canWork&&['To Do','Ongoing','Needs Revision'].includes(t.status)&&(t.needsReview!==false||t.memberCanComplete!==false||admin);
  const by=id=>id?tName(id):'Admin';
  return html`<${Modal} title=${t.name} wide>
    <div class="row"><${Status} s=${t.status}/><${Prio} p=${t.priority}/>${isRetainerTask(t)?html`<span class="chip st-todo">Retainer</span>`:''}
      <span class="muted small">${proj?html`<button class="linkish small" onClick=${()=>{closeModal();go('project',{id:t.projectId})}}>${proj.name}</button>`:'No project'}${proj?.client?' · '+proj.client:''}</span></div>
    ${t.status==='Blocked'&&t.blockedReason?html`<div class="notice bad"><b>Blocked:</b> ${t.blockedReason}</div>`:''}
    ${t.status==='Needs Revision'&&lastSub?.feedback?html`<div class="notice"><b>Revision feedback:</b> <span class="pre">${lastSub.feedback}</span></div>`:''}
    <div class="detail-grid">
      <div class="stack">
        <div class="panel"><div class="label">Instructions</div><div class="pre">${t.description||html`<span class="muted">No instructions added.</span>`}</div><${Links} links=${t.links} files=${t.files}/></div>
        ${canWork&&t.status!=='Done'?html`<div class="panel"><div class="label">Update progress</div>
          <div class="row">
            ${t.status==='To Do'?html`<button class="btn" disabled=${busy} onClick=${()=>setStatus('Ongoing')}>Start work</button>`:''}
            ${t.status==='Blocked'?html`<button class="btn" disabled=${busy} onClick=${()=>setStatus('Ongoing')}>Unblock and continue</button>`:''}
            ${t.status==='Needs Revision'?html`<button class="btn" disabled=${busy} onClick=${()=>setStatus('Ongoing')}>Start revisions</button>`:''}

  const freeOn=d=>M.map(m=>({m,h:freeH(getCell(B,m.id,d))})).filter(x=>x.h>0).sort((a,b)=>b.h-a.h);

  const retNext=[]; Object.entries(S.retainers).filter(([,r])=>r.status==='Active').forEach(([rid,r])=>cycles(r,t0,addDays(t0,13)).forEach(d=>retNext.push({rid,r,d}))); retNext.sort((a,b)=>a.d.localeCompare(b.d));

  return html`

function Tasks({route}){
  const fl=route.filter||{};
  const [q,setQ]=useState(''); const [st,setSt]=useState(fl.status||''); const [pp,setPp]=useState(fl.people||''); const [pr,setPr]=useState(''); const [pj,setPj]=useState(''); const [due,setDue]=useState(fl.due||''); const [tal,setTal]=useState(''); const [nodate,setNodate]=useState(!!fl.nodate);
  useEffect(()=>{setSt(fl.status||'');setPp(fl.people||'');setDue(fl.due||'');setNodate(!!fl.nodate)},[route]);
  let T=tasksArr();
  if(q) T=T.filter(t=>(t.name+' '+(t.description||'')+' '+pName(t.projectId)).toLowerCase().includes(q.toLowerCase()));
  if(st) T=T.filter(t=>t.status===st); else if(!due) T=T.filter(t=>t.status!=='Done');
  if(pp) T=T.filter(t=>pp==='_none'?isUnassigned(t):pp==='_ext'?extOf(t).length:peopleOf(t).includes(pp));
  if(pr) T=T.filter(t=>t.priority===pr); if(pj) T=T.filter(t=>t.projectId===pj); if(tal) T=T.filter(t=>talentsOf(t).includes(tal));
  if(due==='overdue') T=T.filter(isOverdue); if(due==='soon') T=T.filter(t=>dueSoon(t,3)); if(due==='week') T=T.filter(t=>t.due&&t.status!=='Done'&&t.due<=getWeeks()[0].end);
  if(nodate) T=T.filter(t=>ACTIVE.has(t.status)&&!t.due);
  return html`<div class="filters">
    <input type="search" placeholder="Search tasks" value=${q} onInput=${e=>setQ(e.target.value)}/>
    <select value=${st} onChange=${e=>setSt(e.target.value)}><option value="">Open tasks</option>${STATUSES.map(s=>html`<option>${s}</option>`)}</select>
    <select value=${pp} onChange=${e=>setPp(e.target.value)}><option value="">Everyone</option><option value="_none">Unassigned</option><option value="_ext">Outsourced</option>${teamArr().map(m=>html`<option value=${m.id}>${m.name}</option>`)}</select>
    <select value=${pj} onChange=${e=>setPj(e.target.value)}><option value="">All projects</option>${projArr().filter(p=>p.status!=='Archived').map(p=>html`<option value=${p.id}>${p.name}</option>`)}</select>
    <select value=${tal} onChange=${e=>setTal(e.target.value)}><option value="">Any talent</option>${SKILLS.map(s=>html`<option value=${s.id}>${s.label}</option>`)}</select>
    <select value=${pr} onChange=${e=>setPr(e.target.value)}><option value="">Any priority</option>${PRIORITIES.map(p=>html`<option>${p}</option>`)}</select>
    <select value=${due} onChange=${e=>setDue(e.target.value)}><option value="">Any date</option><option value="overdue">Overdue</option><option value="soon">Due in 3 days</option><option value="week">Due this week</option></select>
    <label class="check small"><input type="checkbox" checked=${nodate} onChange=${e=>setNodate(e.target.checked)}/> No date</label>
  </div><div class="small muted">${plural(T.length,'task')}</div><${TaskTable} tasks=${sortTasks(T)} empty=${tasksArr().length?'No tasks match these filters.':'No tasks yet. Create a project, then add tasks to it.'}/>`;
}

function PlanRetainer({rid}){
  const r=S.retainers[rid]; const W=getWeeks(); const ds=cycles(r,today(),W[4].end); const T=tasksArr(); const [busy,setBusy]=useState(false);
  const todo=ds.filter(d=>!T.some(t=>t.retainerId===rid&&t.cycle===d));
  async function create(){ setBusy(true); try{ for(const d of todo){ const days=retainerDays(r,d); const id=uid();
      await saveTaskDoc(id,{name:`${r.name} — ${fmtD(d)}`,projectId:r.projectId||null,description:(r.deliverables||[]).map(x=>'• '+x).join('\n'),assigneeIds:r.responsibleIds||[],talents:r.talents||[],external:[],hoursPerDay:retH(r),start:days[0]===d?'':days[0],due:d,priority:'Normal',needsReview:true,reviewerId:null,memberCanComplete:true,links:[],files:[],status:'To Do',createdAt:nowISO(),createdBy:ui.myId,comments:[],submissions:[],retainerId:rid,cycle:d,history:[hist('Planned from retainer')]});
      (r.responsibleIds||[]).forEach(p=>notify(p,`Retainer task planned: ${r.name} — due ${fmtD(d)}`,id)) }
    toast(`${plural(todo.length,'retainer task')} planned`); closeModal() }catch(e){} setBusy(false) }
  return html`<${Modal} title=${'Plan '+r.name}><div class="stack"><p class="muted">Deliveries in the next 5 weeks: ${ds.length?ds.map(fmtD).join(', '):'none'}.</p>
    ${todo.length?html`<p>This creates <b>${plural(todo.length,'task')}</b> (${todo.map(fmtD).join(', ')}) for ${(r.responsibleIds||[]).map(tName).join(', ')||'no one yet'}, each booking ${plural(Math.max(1,+r.daysPerDelivery||1),'working day')} (${hText(retH(r))} a day) before delivery. Deliveries that already have a task are skipped; nothing existing changes.</p><div><button class="btn primary" disabled=${busy} onClick=${create}>Create ${plural(todo.length,'task')}</button></div>`:html`<p>All deliveries in the next 5 weeks already have tasks.</p>`}
  </div><//>`;
}

  return html`<${Modal} title=${`${tName(pid)} · ${fmtDay(d)}`}><div class="stack"><div class="row"><${AvChip} s=${s}/><span class="small muted">${cellHours(c)}h booked · ${freeH(c)}h free of ${DAY_H}h</span></div>
    ${c.off?html`<div class="notice">Time off: ${c.off}</div>`:''}
    ${c.tasks.length?html`<div class="list">${c.tasks.map(t=>html`<div class="li"><div><button class="linkish" onClick=${()=>openTask(t.id)}>${t.name}</button><div class="small muted">${pName(t.projectId)} · ${dayRangeText(bookedDays(t))} · ${hText(taskH(t))} a day</div></div><${Status} s=${t.status}/></div>`)}</div>`:''}
    ${c.ret.length?html`<div class="small"><b>Retainer work (not planned as a task yet):</b> ${c.ret.map(x=>`${x.r.name} (delivery ${fmtD(x.due)})`).join(', ')}</div>`:''}
    ${s==='free'?html`<p class="muted">Nothing booked. All 8 hours free.</p>`:''}
    ${ui.isAdmin?html`<div><button class="btn sm" onClick=${()=>openModal(html`<${TaskForm} defaults=${{assigneeIds:[pid],due:d}}/>`)}>New task for ${tName(pid)} on this day</button></div>`:''}
  </div><//>` }
function Planning(){
  const [view,setView]=useState('days'); const [wk,setWk]=useState(0); const [tal,setTal]=useState('');
  const W=getWeeks(); const M=teamArr().filter(m=>!tal||hasSkill(m,tal)); const T=tasksArr();
  const B=buildBookings(W[0].start,W[4].end);
  const seg=html`<div class="seg" role="group" aria-label="View">${[['days','Days'],['weeks','Weeks'],['talent','Talent'],['projects','Projects']].map(([k,l])=>html`<button aria-pressed=${view===k} onClick=${()=>setView(k)}>${l}</button>`)}</div>`;
  const weekSeg=html`<div class="seg" role="group" aria-label="Week">${W.map((x,i)=>html`<button aria-pressed=${wk===i} onClick=${()=>setWk(i)}>${i===0?'This week':i===1?'Next week':fmtD(x.start)}</button>`)}</div>`;
  const talSel=html`<select style="width:auto" value=${tal} onChange=${e=>setTal(e.target.value)} aria-label="Filter by talent"><option value="">All talents</option>${SKILLS.filter(s=>teamArr().some(m=>hasSkill(m,s.id))).map(s=>html`<option value=${s.id}>${s.label}</option>`)}</select>`;
  let body;
  if(view==='days'){ const w=W[wk]; const days=[0,1,2,3,4,5,6].map(i=>addDays(w.start,i));
    body=html`<div class="row">${weekSeg}${talSel}</div>${M.length?html`<div class="tablewrap"><table class="plan"><thead><tr><th class="sticky">Person</th>${days.map(d=>html`<th class=${isWorkday(d)?'':'wkend'}>${fmtDay(d)}${d===today()?' · today':''}</th>`)}</tr></thead><tbody>
      ${M.map(m=>html`<tr><td class="sticky"><b>${m.name}</b><div class="small muted">${(m.skills||[]).filter(s=>s.level!=='backup').slice(0,2).map(s=>skillLabel(s.id)).join(', ')}</div></td>
        ${days.map(d=>{ const c=getCell(B,m.id,d); const s=dayStatus(c); const past=d<today(); const we=!isWorkday(d)&&s==='free';
          return html`<td class=${'cell '+(we?'wkend':'')+(past?' past':'')} tabindex="0" onClick=${()=>openModal(html`<${DayDetail} pid=${m.id} d=${d} B=${B}/>`)} onKeyDown=${e=>{if(e.key==='Enter') openModal(html`<${DayDetail} pid=${m.id} d=${d} B=${B}/>`)}}>
            <div class="cellbox">${we?html`<span class="small muted">—</span>`:html`<${AvChip} s=${s} text=${s==='partial'?freeH(c)+'h free':s==='over'?cellHours(c)+'h booked':null}/>`}${s!=='free'&&s!=='off'?html`<span class="small">${cellItems(c).slice(0,2).join(', ')}${cellItems(c).length>2?'…':''}</span>`:''}</div></td>` })}</tr>`)}
    </tbody></table></div>`:html`<${EmptyState} text="No one has this talent."/>`}`;
  } else if(view==='weeks'){
    body=html`<div class="row">${talSel}</div><div class="tablewrap"><table class="plan"><thead><tr><th class="sticky">Person</th>${W.map(w=>html`<th>${w.label}</th>`)}</tr></thead><tbody>
      ${M.map(m=>html`<tr><td class="sticky"><b>${m.name}</b></td>${W.map((w,i)=>{ const s=weekStats(B,m.id,w); const l=weekLevel(s); return html`<td class="cell" tabindex="0" onClick=${()=>{setWk(i);setView('days')}}><div class="cellbox"><span class="h">${s.freeHrs}h free</span><span class="small muted">${plural(s.full,'full day')}</span><span class=${'chip '+WL[l][1]}>${WL[l][0]}</span>${s.off?html`<span class="small muted">${s.off} day${s.off>1?'s':''} off</span>`:''}</div></td>` })}</tr>`)}
    </tbody></table></div><div class="small muted">Free hours across Monday–Friday from today. Click a week to see the days.</div>`;
  } else if(view==='talent'){ const w=W[wk]; const days=weekDays(w);
    const tals=SKILLS.filter(s=>teamArr().some(m=>hasSkill(m,s.id))||T.some(t=>ACTIVE.has(t.status)&&talentsOf(t).includes(s.id)));
    body=html`<div class="row">${weekSeg}</div><div class="tablewrap"><table class="plan"><thead><tr><th class="sticky">Talent</th>${days.map(d=>html`<th>${fmtDay(d)}</th>`)}</tr></thead><tbody>
      ${tals.map(s=>{ const ppl=teamArr().filter(m=>hasSkill(m,s.id)); return html`<tr><td class="sticky"><b>${s.label}</b><div class="small muted">${ppl.map(m=>m.name).join(', ')||'No one on the team'}</div></td>
        ${days.map(d=>{ if(d<today()) return html`<td class="past"></td>`; const free=ppl.map(m=>({m,h:freeH(getCell(B,m.id,d))})).filter(x=>x.h>0); const need=T.filter(t=>ACTIVE.has(t.status)&&talentsOf(t).includes(s.id)&&bookedDays(t).includes(d));
          const ext=need.filter(t=>(t.external||[]).some(x=>x.talent===s.id));
          return html`<td><div class="cellbox"><span class=${'chip '+(free.length?'av-free':ppl.length?'av-double':'rec-outsource')}>${ppl.length?`${free.length} of ${ppl.length} have time`:'None in team'}</span>${free.length?html`<span class="small">${free.map(x=>`${x.m.name} ${x.h}h`).join(', ')}</span>`:''}${need.length?html`<span class="small muted">${plural(need.length,'task')} need it${ext.length?` · ${ext.length} outsourced`:''}</span>`:''}</div></td>` })}</tr>` })}
    </tbody></table></div>`;
  } else {
    const P=projArr().filter(p=>['Active','Draft','On hold'].includes(p.status));
    body=P.length?html`<div class="tablewrap"><table class="plan"><thead><tr><th class="sticky">Project</th>${W.map(w=>html`<th>${w.label}</th>`)}</tr></thead><tbody>
      ${P.map(p=>html`<tr><td class="sticky"><button class="linkish" onClick=${()=>go('project',{id:p.id})}>${p.name}</button><div class="small muted">${p.type}${p.end?' · ends '+fmtD(p.end):''}</div></td>
        ${W.map(w=>{ const pt=T.filter(t=>t.projectId===p.id&&ACTIVE.has(t.status)); let pd=0; const ppl=new Set(); let due=0; pt.forEach(t=>{ const ds=bookedDays(t).filter(d=>d>=w.start&&d<=w.end&&d>=today()); if(ds.length){ peopleOf(t).forEach(x=>ppl.add(x)); pd+=ds.length*Math.max(1,peopleOf(t).length)*taskH(t) } if(t.due>=w.start&&t.due<=w.end) due++ });
          return html`<td><div class="cellbox"><span class="h">${pd?pd+'h booked':'—'}</span>${ppl.size?html`<span class="small muted">${[...ppl].map(tName).join(', ')}</span>`:''}${due?html`<span class="small">${due} due</span>`:''}${p.end&&p.end>=w.start&&p.end<=w.end?html`<span class="chip st-review">Project deadline</span>`:''}</div></td>` })}</tr>`)}
    </tbody></table></div>`:html`<${EmptyState} text="No active projects."/>`;
  }
  return html`<div class="row between">${seg}<span class="small muted">Each task books its people for its hours on its dates. A day is full at 8 hours.</span></div>${body}`;
}

/* ---- reports ---- */
function Reports(){
  const [rep,setRep]=useState('status'); const T=tasksArr(); const W=getWeeks(); const B=buildBookings(today(),W[4].end);
  const reports={
    active:['Active projects',()=>[['Project','Client','Type','Leads','Start','End','Tasks','Done'],projArr().filter(p=>p.status==='Active').map(p=>{const pt=T.filter(t=>t.projectId===p.id); return [p.name,p.client||'',p.type,leadsOf(p).map(tName).join(', '),p.start||'',p.end||'',pt.length,pt.filter(t=>t.status==='Done').length]})]],
    status:['Tasks by status',()=>[['Status','Tasks'],STATUSES.map(s=>[s,T.filter(t=>t.status===s).length])]],
    member:['Tasks by team member',()=>[['Person',...STATUSES,'Overdue'],teamArr().map(m=>[m.name,...STATUSES.map(s=>T.filter(t=>peopleOf(t).includes(m.id)&&t.status===s).length),T.filter(t=>peopleOf(t).includes(m.id)&&isOverdue(t)).length])]],
    overdue:['Overdue and completed',()=>[['Task','Project','People','Deadline','Status','Completed'],[...T.filter(isOverdue),...T.filter(t=>t.status==='Done').sort((a,b)=>String(b.completedAt).localeCompare(String(a.completedAt))).slice(0,50)].map(t=>[t.name,pName(t.projectId),peopleText(t),t.due||'',isOverdue(t)?'Overdue':'Done',t.completedAt?t.completedAt.slice(0,10):''])]],
    review:['Work awaiting review',()=>[['Task','Project','People','Reviewer','Submitted','Version'],T.filter(t=>t.status==='Ready for Review').map(t=>[t.name,pName(t.projectId),peopleText(t),t.reviewerId?tName(t.reviewerId):'Admin',(t.submissions||[]).slice(-1)[0]?.at?.slice(0,10)||'',(t.submissions||[]).length])]],
    mix:['Retainer vs one-off hours',()=>[['Week','Retainer hours','One-off & other hours'],W.map(w=>{ let a=0,b=0; teamArr().forEach(m=>weekDays(w).forEach(d=>{ if(d<today()) return; const c=getCell(B,m.id,d); a+=c.ret.reduce((s,x)=>s+x.h,0)+c.tasks.filter(isRetainerTask).reduce((s,t)=>s+taskH(t),0); b+=c.tasks.filter(t=>!isRetainerTask(t)).reduce((s,t)=>s+taskH(t),0) })); return [w.label,a,b] })]],
    capacity:['Team availability',()=>[['Person',...W.map(w=>w.label+' free hours'),'Overbooked days'],teamArr().map(m=>{ const st=W.map(w=>weekStats(B,m.id,w)); return [m.name,...st.map(s=>s.freeHrs),st.reduce((a,s)=>a+s.over,0)] })]],
    external:['Outsourced talent',()=>{ const by={}; T.forEach(t=>(t.external||[]).forEach(x=>{ by[x.talent]=by[x.talent]||{n:0,types:new Set(),names:new Set()}; by[x.talent].n++; by[x.talent].types.add(x.type); if(x.name) by[x.talent].names.add(x.name) })); return [['Talent','Tasks outsourced','External type','Freelancers used'],Object.entries(by).map(([k,v])=>[skillLabel(k),v.n,[...v.types].join(', '),[...v.names].join(', ')])] }],
  };
  const [head,rows]=reports[rep][1]();
  async function exportCsv(){ const esc=v=>{const s=String(v??''); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}; const csv=[head,...rows].map(r=>r.map(esc).join(',')).join('\n');
    if(!downloadsNs){toast('Download isn\'t available here. Select the table and copy it instead.','err');return}
    try{ await downloadsNs.save({filename:`yth-traffic-${rep}-${today()}.csv`,data:new Blob([csv],{type:'text/csv'})}); toast('CSV saved') }catch(e){ toast('Download was not saved.','err') } }
  return html`<div class="row between"><select style="width:auto" value=${rep} onChange=${e=>setRep(e.target.value)}>${Object.entries(reports).map(([k,[l]])=>html`<option value=${k}>${l}</option>`)}</select><button class="btn" onClick=${exportCsv}>Export CSV</button></div>
    ${rows.length?html`<div class="tablewrap"><table><thead><tr>${head.map(h=>html`<th>${h}</th>`)}</tr></thead><tbody>${rows.map(r=>html`<tr>${r.map(c=>html`<td class=${typeof c==='number'?'num':''}>${c}</td>`)}</tr>`)}</tbody></table></div>`:html`<${EmptyState} text="No data for this report yet."/>`}
    <div class="small muted">Workload reports are for planning fairly and protecting deadlines. They don't rank anyone's performance.</div>`;
}

    <div class="panel"><div class="panel-head"><h3>Linked accounts</h3></div>

  return html`<${Modal} title="Notifications"><div class="stack">
    ${a.derived.length?html`<div class="list">${a.derived.map(x=>html`<div class="li"><button class="linkish" onClick=${()=>{closeModal();openTask(x.taskId)}}>${x.text}</button><span class=${'chip '+(x.kind==='over'?'st-blocked':'st-review')}>${x.kind==='over'?'Overdue':'Due soon'}</span></div>`)}</div>`:''}
    ${a.items.length?html`<div class="list">${a.items.slice(0,40).map(x=>html`<div class="li"><div>${x.taskId&&S.tasks[x.taskId]?html`<button class="linkish" style=${x.read?'font-weight:500':''} onClick=${()=>{closeModal();openTask(x.taskId)}}>${x.text}</button>`:html`<span style=${x.read?'':'font-weight:600'}>${x.text}</span>`}${x.box==='_admins'?html`<div class="small muted">Admin</div>`:''}</div><span class="small muted" style="white-space:nowrap">${fmtTS(x.at)}</span></div>`)}</div>`:(!a.derived.length?html`<${EmptyState} text="No notifications."/>`:'')}
  </div><//>` }

/* ================= shell ================= */
const PAGES={
  overview:{label:'Overview',admin:true,comp:Overview},
  mywork:{label:'My Work',comp:MyWork},
  projects:{label:'Projects',comp:Projects,admin:true,action:['New project',()=>openModal(html`<${ProjectForm}/>`)]},
  tasks:{label:'Tasks',comp:Tasks,admin:true,action:['New task',()=>openModal(html`<${TaskForm}/>`)]},
  reviews:{label:'Reviews',comp:Reviews},
  planning:{label:'Availability',admin:true,comp:Planning,group:'plan',action:['New task',()=>openModal(html`<${TaskForm}/>`)]},
  retainers:{label:'Retainers',admin:true,comp:Retainers,group:'plan',action:['New retainer',()=>openModal(html`<${RetainerForm}/>`)]},
  team:{label:'Team',admin:true,comp:Team,group:'plan',action:['Add a person',()=>openModal(html`<${TeamForm}/>`)]},
  reports:{label:'Reports',admin:true,comp:Reports,group:'plan'},
  settings:{label:'Access',admin:true,comp:Settings,group:'plan'},
  project:{label:'Project',comp:ProjectPage,hidden:true},
};
const SUBTITLE={overview:'Where the agency stands today',mywork:'Your tasks, schedule and revisions',projects:'All client, internal and proposal work',tasks:'Every task across the agency',reviews:'Submitted work waiting for a decision',planning:'Who is free on which day, this week and the next four',retainers:'Recurring client commitments, booked first',team:'Roles, talents and time off',reports:'Simple reports you can export',settings:'Team accounts and admin access'};

function AuthScreen({mode}){
  const [tab,setTab]=useState(mode==='recover'?'recover':'in'); const [f,setF]=useState({name:'',email:'',pw:''}); const [busy,setBusy]=useState(false); const [msg,setMsg]=useState(null);
  const set=(k,v)=>setF(o=>({...o,[k]:v}));
  async function submit(e){ e.preventDefault(); setMsg(null); setBusy(true);
    try{
      if(tab==='in'){ const {data,error}=await sb.auth.signInWithPassword({email:f.email.trim(),password:f.pw}); if(error) throw error; S.boot='loading'; rerender(); await start(data.user) }
      else if(tab==='up'){ if(!f.name.trim()) throw new Error('Enter your name.'); if(f.pw.length<8) throw new Error('Use a password of at least 8 characters.');
        const {data,error}=await sb.auth.signUp({email:f.email.trim(),password:f.pw,options:{data:{name:f.name.trim()},emailRedirectTo:location.origin+location.pathname}}); if(error) throw error;
        if(data.session){ S.boot='loading'; rerender(); await start(data.user) } else setMsg({ok:true,text:'Account created. Check your email for a confirmation link, then sign in.'}) }
      else if(tab==='reset'){ const {error}=await sb.auth.resetPasswordForEmail(f.email.trim(),{redirectTo:location.origin+location.pathname}); if(error) throw error; setMsg({ok:true,text:'If that email has an account, a reset link is on its way.'}) }
      else if(tab==='recover'){ if(f.pw.length<8) throw new Error('Use a password of at least 8 characters.'); const {data,error}=await sb.auth.updateUser({password:f.pw}); if(error) throw error; S.boot='loading'; rerender(); await start(data.user) }
    }catch(err){ const m=String(err.message||err); setMsg({ok:false,text:/Invalid login/i.test(m)?'Email or password is wrong.':/already registered/i.test(m)?'That email already has an account. Sign in instead.':/not confirmed/i.test(m)?'Confirm your email first: open the link we sent you.':m}) }
    setBusy(false) }
  return html`<div class="boot"><form class="panel auth" style="text-align:left" onSubmit=${submit}>
    <div class="brand" style="padding:0"><div class="mark">YTH</div><div><div class="t">Project Management</div><div class="s">Youthopians</div></div></div>
    ${tab!=='recover'&&tab!=='reset'?html`<div class="tabs" role="tablist"><button type="button" role="tab" aria-selected=${tab==='in'} onClick=${()=>{setTab('in');setMsg(null)}}>Sign in</button><button type="button" role="tab" aria-selected=${tab==='up'} onClick=${()=>{setTab('up');setMsg(null)}}>Create account</button></div>`:html`<h2>${tab==='reset'?'Reset your password':'Choose a new password'}</h2>`}
    ${tab==='up'?html`<${Field} label="Your name"><input id="a-name" type="text" autocomplete="name" value=${f.name} onInput=${e=>set('name',e.target.value)} placeholder="e.g. Yonas Birhanu"/><//>`:''}
    ${tab!=='recover'?html`<${Field} label="Email"><input id="a-email" type="text" inputmode="email" autocomplete="email" value=${f.email} onInput=${e=>set('email',e.target.value)}/><//>`:''}
    ${tab!=='reset'?html`<${Field} label=${tab==='in'?'Password':'New password'} hint=${tab==='in'?'':'at least 8 characters'}><input id="a-pw" type="password" autocomplete=${tab==='in'?'current-password':'new-password'} style="width:100%;border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:8px 10px;min-height:38px" value=${f.pw} onInput=${e=>set('pw',e.target.value)}/><//>`:''}
    ${msg?html`<div class=${'notice'+(msg.ok?' info':' bad')}>${msg.text}</div>`:''}
    <button class="btn primary" type="submit" disabled=${busy}>${busy?'Please wait…':tab==='in'?'Sign in':tab==='up'?'Create account':tab==='reset'?'Send reset link':'Save password'}</button>
    ${tab==='in'?html`<button type="button" class="linkish small" style="font-weight:500" onClick=${()=>{setTab('reset');setMsg(null)}}>Forgot your password?</button>`:''}
    ${tab==='reset'?html`<button type="button" class="linkish small" style="font-weight:500" onClick=${()=>{setTab('in');setMsg(null)}}>Back to sign in</button>`:''}
  </form></div>`;
}
function ClaimScreen(){ const [busy,setBusy]=useState(false);
  async function claim(){ setBusy(true); const {data,error}=await sb.rpc('yth_claim_owner'); if(error||!data){ toast('Someone has already set up this workspace.','err'); setBusy(false); await loadAll(); return } await loadAll(); setBusy(false) }
  return html`<div class="boot"><div class="panel" style="text-align:left;max-width:520px"><h2>Set up the workspace</h2><p class="muted">No one owns this workspace yet. The first person to set it up becomes the owner and administrator. Only do this if you're the Youthopians admin.</p><div class="row"><button class="btn primary" disabled=${busy} onClick=${claim}>Make me the owner</button><button class="btn" onClick=${signOut}>Sign out</button></div></div></div>` }

function App(){
  const [,bump]=useState(0); const [modal,setModal]=useState(null); const [t,setT]=useState(null);
  const startPage=()=>{ const h=(location.hash||'').slice(1); return PAGES[h]&&!PAGES[h].hidden?h:null };
  const [route,setRoute]=useState({page:startPage()||'auto'});
  rerender=()=>bump(x=>x+1); openModal=n=>setModal(n); closeModal=()=>setModal(null);
  const tt=useRef(); toast=(msg,kind)=>{ setT({msg,kind}); clearTimeout(tt.current); tt.current=setTimeout(()=>setT(null),kind==='err'?6000:2600) };
  go=(page,extra={})=>{ setRoute({page,...extra,ts:Date.now()}); scrollTo(0,0) };
  useEffect(()=>{boot()},[]);
  if(S.boot==='loading') return html`<div class="boot"><div><div class="label">YTH Project Management</div><p class="muted">Connecting to your workspace…</p></div></div>`;
  if(S.boot==='login'||S.boot==='recover') return html`<${AuthScreen} mode=${S.boot}/>`;
  if(S.boot==='error') return html`<div class="boot"><div class="panel" style="text-align:left"><h2>YTH Project Management can't load</h2><p>${S.err}</p><div class="row"><button class="btn primary" onClick=${()=>location.reload()}>Reload</button><button class="btn" onClick=${signOut}>Sign out</button></div></div></div>`;
  if(!['team','config','tasks'].every(k=>S.loaded[k])) return html`<div class="boot"><div><div class="label">YTH Project Management</div><p class="muted">Loading your work…</p></div></div>`;
  ui.isAdmin=isAdmin(); ui.myId=myTeamId();
  if(!S.config.ownerId) return html`<${ClaimScreen}/>`;
  if(!ui.isAdmin&&!ui.myId){ if(!S.joinSent){ S.joinSent=true; db.doc('joins/'+S.me.id).set({at:nowISO(),email:S.me.email,name:S.me.name}).catch(()=>{}); setInterval(()=>loadAll().catch(()=>{}),15000) }
    return html`<div class="boot"><div class="panel"><div class="brand" style="padding:0;justify-content:center"><div class="mark">YTH</div><div class="t">Traffic</div></div><h2>You're signed in</h2><p class="muted">You're signed in as <b>${S.me.email}</b>, but your account isn't linked to the YTH team yet. Ask your admin to open <b>Access</b> and link you. This page updates by itself once they do.</p><div><button class="btn sm" onClick=${signOut}>Sign out</button></div></div></div>` }
  let page=route.page; if(page==='auto') page=ui.isAdmin?'overview':'mywork';
  if(!PAGES[page]||(PAGES[page].admin&&!ui.isAdmin)) page='mywork';
  const Pg=PAGES[page];
  const nav=Object.entries(PAGES).filter(([k,p])=>!p.hidden&&(!p.admin||ui.isAdmin)&&!(k==='reviews'&&!ui.isAdmin&&!tasksArr().some(t=>t.reviewerId===ui.myId)));
  const counts={reviews:tasksArr().filter(t=>t.status==='Ready for Review'&&(ui.isAdmin||t.reviewerId===ui.myId)).length,mywork:ui.myId?tasksArr().filter(t=>isMine(t)&&(t.status==='Needs Revision'||isOverdue(t)&&ACTIVE.has(t.status))).length:0};
  const alerts=myAlerts();
  const navBtn=([k,p])=>html`<button aria-current=${(page===k||(page==='project'&&k==='projects'))?'page':null} onClick=${()=>go(k)}><span>${p.label}</span>${counts[k]?html`<span class="count">${counts[k]}</span>`:''}</button>`;
  return html`<div class="shell">
    <aside class="rail"><div class="brand"><div class="mark">YTH</div><div><div class="t">Traffic</div><div class="s">Youthopians</div></div></div>
      <nav class="nav-group nav" aria-label="Main">${nav.filter(([,p])=>!p.group).map(navBtn)}</nav>
      ${ui.isAdmin?html`<nav class="nav-group nav" aria-label="Planning"><div class="label">Planning</div>${nav.filter(([,p])=>p.group==='plan').map(navBtn)}</nav>`:''}
      <div class="rail-foot"><span><b>${ui.myId?tName(ui.myId):'Owner'}</b></span><span class="muted">${ui.isAdmin?'Administrator':'Team member'}</span><span class="muted" style="overflow-wrap:anywhere">${S.me.email}</span><button class="btn sm" style="align-self:flex-start;margin-top:6px" onClick=${signOut}>Sign out</button></div></aside>
    <main class="main">
      <nav class="mobile-nav" aria-label="Main">${nav.map(([k,p])=>html`<button aria-current=${page===k?'page':null} onClick=${()=>go(k)}>${p.label}${counts[k]?` (${counts[k]})`:''}</button>`)}<button onClick=${signOut}>Sign out</button></nav>
      <header class="topbar"><div>${page!=='project'?html`<h1>${Pg.label}</h1><div class="small muted">${SUBTITLE[page]||''}</div>`:html`<div class="label">Project</div>`}</div>
        <div class="row">${Pg.action&&ui.isAdmin?html`<button class="btn primary" onClick=${Pg.action[1]}>${Pg.action[0]}</button>`:''}
          <button class="btn bell" onClick=${()=>openModal(html`<${NotifPanel}/>`)} aria-label=${`Notifications, ${alerts.unread} new`}>Notifications${alerts.unread?html`<span class="dot">${alerts.unread>99?'99+':alerts.unread}</span>`:''}</button></div></header>
      <div class="content">${html`<${Pg.comp} route=${route}/>`}</div>
    </main>
    ${modal}
    ${t?html`<div class=${'toast'+(t.kind==='err'?' err':'')} role="status">${t.msg}</div>`:''}
  </div>`;
}
render(html`<${App}/>`, document.getElementById('app'));

</script>
</body>
</html>
